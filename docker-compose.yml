version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: flowspace_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowspace_user
      POSTGRES_PASSWORD: flowspace_password
      POSTGRES_DB: flowspace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowspace_user -d flowspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowspace_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://flowspace_user:flowspace_password@db:5432/flowspace_db
      - SECRET_KEY=supersecretjwtkeyplaceholderchangeinproduction
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - LOG_LEVEL=INFO
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flowspace_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  uploads_data:
