version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: flowspace_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowspace_user
      POSTGRES_PASSWORD: flowspace_password
      POSTGRES_DB: flowspace_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowspace_user -d flowspace_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: flowspace_backend_dev
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://flowspace_user:flowspace_password@db:5432/flowspace_db
      - SECRET_KEY=453fd98a8bf8deab365c1926649f87cc4f18d7aa8491c944111be174cfd36a8d
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=120
      - LOG_LEVEL=DEBUG
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: nginx:alpine
    container_name: flowspace_frontend_dev
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./frontend/build/web:/usr/share/nginx/html
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data_dev:
